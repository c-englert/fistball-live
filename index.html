<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fistball Live — 2026 U18 WC & Women's EFA</title>
  <meta name="description" content="Live results, standings and fixtures for the 2026 U18 World Championship & Women's EFA Championship." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href="icons/favicon-64.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fistball Live" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true"><img src="assets/ifa-mark.png" alt="IFA" /></div>
        <div class="brand-text">
          <h1>Fistball Live</h1>
          <p class="event-name">2026 U18 World Championship &amp; Women's EFA Championship</p>
          <p class="event-sub">Reiden · Switzerland · 23–26 July 2026</p>
        </div>
      </div>
      <div id="eventLogos" class="event-logos"></div>
      <div class="header-actions">
        <span id="liveDot" class="live-dot" title="Live"></span>
        <span id="updated" class="updated">—</span>
        <button id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh">⟳</button>
        <button id="installBtn" class="install-btn" hidden>Install</button>
      </div>
    </div>
  </header>

  <nav class="category-bar" aria-label="Categories">
    <div id="categoryPills" class="category-pills"></div>
  </nav>

  <main class="content">
    <div class="view-tabs" role="tablist">
      <button id="tabStandings" class="view-tab is-active" role="tab">Standings</button>
      <button id="tabBracket" class="view-tab" role="tab">Bracket</button>
      <button id="tabMatches" class="view-tab" role="tab">Matches</button>
      <button id="tabCards" class="view-tab" role="tab">Cards</button>
    </div>

    <section id="banner" class="banner" hidden></section>
    <section id="countdown" class="countdown" hidden></section>

    <section id="standingsView" class="view">
      <div id="standings"></div>
    </section>

    <section id="bracketView" class="view" hidden>
      <div id="bracket"></div>
    </section>

    <section id="cardsView" class="view" hidden>
      <div id="cards"></div>
    </section>

    <section id="matchesView" class="view" hidden>
      <div class="match-filter" id="matchFilter"></div>
      <div id="matches"></div>
    </section>

    <div id="loading" class="loading">Loading results…</div>
  </main>

  <footer class="app-footer">
    <p>Data updates live from the official scoring sheet. Standings are computed from completed group-stage matches.</p>
  </footer>


  <script src="app.js"></script>

  <!-- Live scoreboard from Fistball Arena (Firestore, public read).
       Reads the public `public/live` pointer to know WHICH event to show, then
       subscribes that event's results. Overlays the sheet by match number. -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    try {
      const app = initializeApp({
        apiKey: "AIzaSyAca__YTy_Y6tlX62jJ6aK_qHhJgUD4V0w",
        authDomain: "fistball-arena.firebaseapp.com",
        projectId: "fistball-arena",
        appId: "1:261226374717:web:d267cc2b02175e85bf2c54",
      });
      const db = getFirestore(app);
      let resultsUnsub = null, brandUnsub = null;

      function applyBranding(b) {
        const el = document.getElementById("eventLogos");
        if (el) {
          const urls = [];
          if (b && b.eventLogo && b.eventLogo.dataUrl) urls.push(b.eventLogo.dataUrl);
          for (const p of (b && b.promoters) || []) if (p && p.dataUrl) urls.push(p.dataUrl);
          el.innerHTML = urls.map((u) => '<img src="' + u + '" alt="" />').join("");
        }
        if (b && b.name) {
          const n = document.querySelector(".event-name");
          if (n) n.textContent = b.name;
        }
      }

      // Follow the admin-selected event; re-subscribe results + branding on change.
      onSnapshot(doc(db, "public", "live"), (snap) => {
        const data = snap.exists() ? snap.data() : null;
        const eid = data ? data.eventId : null;
        if (window.applyLivePointer) window.applyLivePointer(data); // {eventId,name,startsAt,...} or null
        if (resultsUnsub) { resultsUnsub(); resultsUnsub = null; }
        if (brandUnsub) { brandUnsub(); brandUnsub = null; }
        if (eid) {
          resultsUnsub = onSnapshot(
            collection(db, "events", eid, "results"),
            (rs) => window.applyFsResults && window.applyFsResults(rs.docs.map((d) => d.data())),
            (err) => console.warn("Firestore results unavailable:", err)
          );
          brandUnsub = onSnapshot(
            doc(db, "public", "event_" + eid),
            (b) => applyBranding(b.exists() ? b.data() : null),
            (err) => console.warn("Branding unavailable:", err)
          );
        } else {
          window.applyFsResults && window.applyFsResults([]);
          applyBranding(null);
        }
      }, (err) => console.warn("Live pointer unavailable:", err));
    } catch (e) {
      console.warn("Firestore init skipped:", e);
    }
  </script>
</body>
</html>
